<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kill The Earth</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #eee;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        .game-container {
            max-width: 700px;
            margin: 30px auto;
            padding: 30px;
            border: 2px solid #ff4757;
            border-radius: 10px;
        }
        
        h1 {
            color: #ff4757;
            margin-bottom: 10px;
        }
        
        .stats-bar {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            gap: 10px;
        }
        
        .stat-box {
            background-color: #2d2d4a;
            padding: 15px;
            border-radius: 8px;
            flex: 1;
        }
        
        .stat-label {
            font-size: 14px;
            color: #aaa;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #ff6b81;
        }
        
        .damage-bar, .energy-bar {
            width: 100%;
            height: 20px;
            background-color: #333;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .damage-fill {
            height: 100%;
            background-color: #ff4757;
            transition: width 0.3s ease;
            line-height: 20px;
            color: white;
            font-size: 12px;
        }
        
        .energy-fill {
            height: 100%;
            background-color: #ffa502;
            transition: width 0.3s ease;
            line-height: 20px;
            color: black;
            font-size: 12px;
        }
        
        .actions {
            display: grid;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            padding: 15px 25px;
            font-size: 16px;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.3s;
        }
        
        button:hover:not(:disabled) {
            background-color: #ff6b81;
            transform: scale(1.05);
        }
        
        button:active:not(:disabled) {
            transform: scale(0.95);
        }
        
        button:disabled {
            background-color: #666;
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .quiz-section {
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid #333;
        }
        
        .question {
            font-size: 18px;
            margin-bottom: 15px;
            color: #ffa502;
        }
        
        .answer-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .answer-btn {
            background-color: #333;
            padding: 12px;
            border: 1px solid #ffa502;
            border-radius: 5px;
        }
        
        .answer-btn:hover:not(:disabled) {
            background-color: #444;
        }
        
        .answer-btn.correct-answer {
            background-color: #2ecc71 !important;
            border-color: #2ecc71 !important;
            color: white !important;
        }
        
        .answer-btn.selected-wrong {
            background-color: #e74c3c !important;
            border-color: #e74c3c !important;
            color: white !important;
        }
        
        .feedback {
            margin-top: 15px;
            font-size: 16px;
            min-height: 60px;
            padding: 10px;
            border-radius: 5px;
        }
        
        .correct-feedback {
            color: #2ecc71;
            background-color: rgba(46, 204, 113, 0.1);
        }
        
        .wrong-feedback {
            color: #e74c3c;
            background-color: rgba(231, 76, 60, 0.1);
        }
        
        .show-answer {
            font-weight: bold;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed #444;
            color: #2ecc71;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .shake {
            animation: shake 0.3s;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🌍 Kill The Earth 🌍</h1>
        <p>Destroy the planet using actions (cost energy) & earn energy via trivia!</p>
        
        <div class="stats-bar">
            <div class="stat-box">
                <div class="stat-label">Damage Points</div>
                <div class="stat-value"><span id="score">0</span></div>
                <div class="damage-bar">
                    <div class="damage-fill" id="progress" style="width: 0%">0%</div>
                </div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Energy</div>
                <div class="stat-value"><span id="energy">100</span>/100 ⚡</div>
                <div class="energy-bar">
                    <div class="energy-fill" id="energyBar" style="width: 100%"></div>
                </div>
            </div>
        </div>
        
        <div class="actions">
            <button onclick="useAction(10, 10)" id="btn-pollute">Pollute (-10⚡)</button>
            <button onclick="useAction(25, 25)" id="btn-deforest">Deforest (-25⚡)</button>
            <button onclick="useAction(50, 50)" id="btn-overfish">Overfish (-50⚡)</button>
            <button onclick="useAction(100, 100)" id="btn-nuclear">Nuclear Blast (-100⚡)</button>
        </div>
        
        <div class="quiz-section">
            <h3>⚡ Earn Energy via Trivia ⚡</h3>
            <p class="question" id="question">Loading question...</p>
            <div class="answer-buttons" id="answers">
                <button class="answer-btn" onclick="checkAnswer(0)">Answer 1</button>
                <button class="answer-btn" onclick="checkAnswer(1)">Answer 2</button>
                <button class="answer-btn" onclick="checkAnswer(2)">Answer 3</button>
                <button class="answer-btn" onclick="checkAnswer(3)">Answer 4</button>
            </div>
            <div class="feedback" id="feedback"></div>
        </div>
        
        <button onclick="resetGame()" style="margin-top: 20px; background-color: #555;">Reset Game</button>
    </div>
    
    <script>
        let score = 0;
        let energy = 100;
        const totalToDestroy = 1000;
        
        // Trivia questions - environmental themed
        const questions = [
            { q: "What percentage of Earth's oxygen comes from oceans?", a: ["70%", "50%", "30%", "90%"], correct: 0 },
            { q: "How many species go extinct daily due to human activity?", a: ["~200", "~50", "~1000", "~50"], correct: 0 },
            { q: "What year did global warming become widely recognized?", a: ["1980s", "1990s", "1970s", "2000s"], correct: 0 },
            { q: "Which gas contributes MOST to greenhouse effect?", a: ["CO₂", "Oxygen", "Nitrogen", "Helium"], correct: 0 },
            { q: "How many plastic items enter oceans yearly?", a: ["8 million tons", "1 million tons", "50 million tons", "100 thousand tons"], correct: 0 },
            { q: "What % of rainforest has been destroyed?", a: ["~50%", "~10%", "~80%", "~30%"], correct: 0 },
            { q: "Largest cause of deforestation globally?", a: ["Cattle farming", "Logging", "Mining", "Urban growth"], correct: 0 },
            { q: "How long does plastic take to decompose?", a: ["450+ years", "50 years", "10 years", "100 years"], correct: 0 }
        ];
        
        function useAction(damage, cost) {
            if (energy >= cost) {
                energy -= cost;
                score += damage;
                if (score > totalToDestroy) score = totalToDestroy;
                
                document.body.classList.add('shake');
                setTimeout(() => document.body.classList.remove('shake'), 300);
                
                updateDisplay();
            }
        }
        
        let currentQuestion = null;
        
        function loadQuestion() {
            currentQuestion = questions[Math.floor(Math.random() * questions.length)];
            document.getElementById('question').textContent = currentQuestion.q;
            const btns = document.querySelectorAll('.answer-btn');
            currentQuestion.a.forEach((ans, i) => {
                btns[i].textContent = ans;
                btns[i].className = 'answer-btn'; // Reset classes
                btns[i].disabled = false;
            });
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
        }
        
        function checkAnswer(selected) {
            const btns = document.querySelectorAll('.answer-btn');
            
            // Highlight selected answer
            if (selected === currentQuestion.correct) {
                // Correct answer
                btns[selected].classList.add('correct-answer');
                energy = Math.min(energy + 25, 100);
                document.getElementById('feedback').innerHTML = `
                    ✓ <strong>Correct!</strong> +25 Energy
                    <div class="show-answer">✅ Correct Answer: ${currentQuestion.a[currentQuestion.correct]}</div>
                `;
                document.getElementById('feedback').className = 'feedback correct-feedback';
            } else {
                // Wrong answer - show both
                btns[selected].classList.add('selected-wrong');
                btns[currentQuestion.correct].classList.add('correct-answer');
                document.getElementById('feedback').innerHTML = `
                    ✗ <strong>Wrong!</strong> No energy gained.
                    <div class="show-answer">✅ Correct Answer: ${currentQuestion.a[currentQuestion.correct]}</div>
                `;
                document.getElementById('feedback').className = 'feedback wrong-feedback';
            }
            
            // Disable all buttons
            btns.forEach(b => b.disabled = true);
            setTimeout(loadQuestion, 2000); // Longer delay to see the correct answer
            updateDisplay();
        }
        
        function updateDisplay() {
            const damagePct = (score / totalToDestroy) * 100;
            const energyPct = (energy / 100) * 100;
            
            document.getElementById('score').textContent = score;
            document.getElementById('progress').style.width = damagePct + '%';
            document.getElementById('progress').textContent = Math.round(damagePct) + '%';
            
            document.getElementById('energy').textContent = energy;
            document.getElementById('energyBar').style.width = energyPct + '%';
            
            // Disable buttons if not enough energy
            document.getElementById('btn-pollute').disabled = energy < 10;
            document.getElementById('btn-deforest').disabled = energy < 25;
            document.getElementById('btn-overfish').disabled = energy < 50;
            document.getElementById('btn-nuclear').disabled = energy < 100;
            
            if (score >= totalToDestroy) {
                alert('🌍 PLANET DESTROYED! You killed the Earth! Game Over.');
                resetGame();
            }
        }
        
        function resetGame() {
            score = 0;
            energy = 100;
            updateDisplay();
            loadQuestion();
        }
        
        // Initialize
        loadQuestion();
        updateDisplay();
    </script>
</body>
</html>
